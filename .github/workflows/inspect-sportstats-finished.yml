name: One-shot SportStatsAPI finished-match inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-sportstats-finished.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make exactly one historical matches request
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, requests
          url = "https://api.sportstatsapi.com/api/v1/soccer/matches"
          headers = {"Authorization": f"Bearer {os.environ['SPORTSTATS_API_KEY']}", "Accept": "application/json"}
          params = {"league_id": "l30", "date_from": "2026-11-01", "date_to": "2026-11-11", "limit": 100, "order": "asc"}
          response = requests.get(url, headers=headers, params=params, timeout=35)
          print("HTTP_STATUS:", response.status_code)
          response.raise_for_status()
          body = response.json()
          if body.get("success") is not True or not isinstance(body.get("data"), list):
              print("UNEXPECTED_RESPONSE:", json.dumps(body, ensure_ascii=False))
              sys.exit(0)
          rows = body["data"]
          print("TOTAL_ROWS_RETURNED:", len(rows))
          finished = [row for row in rows if str(row.get("status") or "").upper() not in {"NS", "TBD", "SCHEDULED", "NOT_STARTED", ""}]
          if finished:
              print("FIRST_NON_SCHEDULED_MATCH_FULL_ROW:")
              print(json.dumps(finished[0], ensure_ascii=False, indent=2))
          else:
              print("NO_NON_SCHEDULED_MATCH_IN_THIS_SINGLE_RESPONSE")
              print("STATUSES_RETURNED:", json.dumps(sorted({str(row.get("status")) for row in rows}), ensure_ascii=False))
          PY
