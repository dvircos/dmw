name: Sync Nations League

on:
  schedule:
    # Checks often, but the job calls the sports API only when a fixture,
    # odds lock, or final result is actually due. Quota is enforced in the database.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-nations-league
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sync fixtures, odds, and 90-minute results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py
