name: GitHub Actions Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostic.yml"

permissions:
  contents: read

jobs:
  sportstats-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SportStatsAPI match lifecycle (read-only)
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone

          BASE = "https://api.sportstatsapi.com/api/v1"
          HEADERS = {"Authorization": "Bearer " + os.environ["SPORTSTATS_API_KEY"]}
          LEAGUES = {
              "EPL": "l30",
              "LA_LIGA": "l6t",
              "ISRAEL": "l46",
              "UEFA_NATIONS_LEAGUE": "lml",
              "UEFA_CHAMPIONS_LEAGUE": "l3",
          }
          now = datetime.now(timezone.utc).date()
          past_from = (now - timedelta(days=14)).isoformat()
          today = now.isoformat()
          future_to = (now + timedelta(days=14)).isoformat()
          calls = 0

          def get(path):
              global calls
              if calls:
                  time.sleep(13)
              calls += 1
              req = urllib.request.Request(BASE + path, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.loads(response.read())
                      print("HTTP", response.status, "remaining=", response.headers.get("X-RateLimit-Remaining"), "age=", response.headers.get("Age"), "path=", path)
                      if body.get("success") is not True:
                          raise RuntimeError("API success was not true: " + str(body.get("error")))
                      return body
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR", e.code, e.read().decode("utf-8", "replace")[:1000], "path=", path)
                  raise

          catalog = get("/soccer/leagues")
          by_code = {x.get("code"): x for x in catalog.get("data", [])}
          for label, code in LEAGUES.items():
              print("LEAGUE_MAPPING", label, code, json.dumps(by_code.get(code), ensure_ascii=False))

          finished_samples = []
          for label, code in LEAGUES.items():
              body = get(f"/soccer/matches?league_id={code}&date_from={past_from}&date_to={today}&limit=100&order=desc")
              rows = body.get("data", [])
              print("HISTORY", label, "count=", len(rows), "meta=", json.dumps(body.get("meta", {}), ensure_ascii=False)[:500])
              for row in rows:
                  if row.get("status_code") == "finished" or row.get("status") == "FT":
                      finished_samples.append((label, row))
              if rows:
                  print("HISTORY_SAMPLE", label, json.dumps(rows[0], ensure_ascii=False)[:1800])

          future_samples = []
          for label, code in LEAGUES.items():
              body = get(f"/soccer/matches?league_id={code}&date_from={today}&date_to={future_to}&limit=100&order=asc")
              rows = body.get("data", [])
              print("UPCOMING", label, "count=", len(rows), "meta=", json.dumps(body.get("meta", {}), ensure_ascii=False)[:500])
              if rows:
                  row = rows[0]
                  future_samples.append((label, row))
                  print("UPCOMING_SAMPLE", label, json.dumps(row, ensure_ascii=False)[:1500])

          if finished_samples:
              label, match = finished_samples[0]
              code = match.get("code") or match.get("id") or match.get("match_id")
              if not code:
                  raise RuntimeError("Finished match row has no usable match identifier")
              detail = get("/soccer/matches/" + str(code))
              item = detail.get("data")
              if isinstance(item, list):
                  item = item[0] if item else None
              if not isinstance(item, dict):
                  raise RuntimeError("Match detail endpoint returned no match object")
              print("DETAIL_TEST", label, "id=", code, "fields=", sorted(item.keys()))
              print("DETAIL_SAMPLE", json.dumps(item, ensure_ascii=False)[:3500])
          else:
              print("DETAIL_TEST_SKIPPED_NO_FINISHED_MATCH_IN_14_DAY_WINDOW")

          print("SUMMARY", json.dumps({
              "league_codes": LEAGUES,
              "history_window": [past_from, today],
              "future_window": [today, future_to],
              "finished_samples_found": len(finished_samples),
              "detail_tested": bool(finished_samples),
              "api_calls": calls
          }, ensure_ascii=False))
          print("DIAGNOSTIC_COMPLETE")
          PY
