name: Verify existing Nations League provider mapping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-existing-nations.yml

permissions:
  contents: read

concurrency:
  group: verify-existing-nations-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify existing Nations League provider mapping'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify existing fixture IDs and sync confirmed results only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          SPORTS_API_PROVIDER: rapidapi
        run: python sync_existing_nations.py
