name: Existing Nations League results sync

on:
  schedule:
    # 17:00-21:30 UTC = evening in Israel; 10 polls per night.
    - cron: "0,30 17-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: existing-nations-evening-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Sync results only for existing Nations League games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          SPORTS_API_PROVIDER: rapidapi
        run: python sync_existing_nations.py
