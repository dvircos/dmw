name: SportStatsAPI result sync

on:
  # Run once immediately when the result-sync logic or this workflow changes.
  push:
    branches: [main]
    paths:
      - "sync_sportstats.py"
      - ".github/workflows/sportstats-results.yml"
  # Allow a one-off manual run without changing the recurring schedule.
  workflow_dispatch:
  # Check every 30 minutes; pending matches remain eligible until FT is confirmed.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: sportstats-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync live scores and confirmed full-time results
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: schedule
        run: python sync_sportstats.py results
