<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="מרדכי ווינרים — הדמיית הימורים וירטואלית על ליגת האומות" />
    <title>מרדכי ווינרים - ליגת האומות</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Rubik", "sans-serif"] },
            colors: {
              ink: "#0f172a",
              panel: "#1e293b",
              gold: "#f59e0b",
              mint: "#4ade80",
              mist: "#94a3b8",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: Rubik, sans-serif;
        color: #f8fafc;
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        background-attachment: fixed;
      }
      .flash { animation: flash 0.6s ease; }
      @keyframes flash { from { transform: scale(1.06); } to { transform: scale(1); } }
      .live-dot { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      #sheet-backdrop { direction: ltr; }
      #sheet-backdrop:not(.hidden) {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sheet {
        direction: rtl;
        width: min(28rem, 90vw);
        max-width: 90vw;
        max-height: 90vh;
      }
      /* Theme tokens: the existing night palette remains the default. */
      body { transition: background .25s ease, color .25s ease; }
      #splash-screen { transition: opacity .45s ease, visibility .45s ease; }
      #splash-screen.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .icon-button { display:inline-flex; align-items:center; justify-content:center; width:2.5rem; height:2.5rem; border:1px solid rgba(148,163,184,.25); border-radius:9999px; }
      .search-wrap { position:relative; }
      .search-wrap svg { position:absolute; right:1rem; top:50%; transform:translateY(-50%); pointer-events:none; }
      .search-wrap input { padding-right:2.8rem; }
      body[data-theme="light"] { color:#172554; background:linear-gradient(180deg,#f8fbff 0%,#eaf2ff 100%); }
      body[data-theme="light"] .bg-ink, body[data-theme="light"] .bg-ink\/70, body[data-theme="light"] .bg-ink\/60 { background-color:#eaf2ff !important; }
      body[data-theme="light"] .bg-panel { background-color:#ffffff !important; }
      body[data-theme="light"] .bg-ink\/90, body[data-theme="light"] .bg-ink\/95 { background-color:rgba(255,255,255,.94) !important; }
      body[data-theme="light"] .text-slate-50, body[data-theme="light"] .text-white { color:#172554 !important; }
      body[data-theme="light"] .text-slate-300, body[data-theme="light"] .text-slate-400, body[data-theme="light"] .text-mist { color:#526581 !important; }
      body[data-theme="light"] .border-slate-700\/50, body[data-theme="light"] .border-white\/10 { border-color:#d5e2f3 !important; }
      body[data-theme="light"] .bg-white\/5 { background-color:#edf4ff !important; }
      body[data-theme="light"] .text-mint { color:#15803d !important; }
      body[data-theme="light"] .text-gold { color:#1d4ed8 !important; }
      body[data-theme="light"] .bg-gold { background-color:#2563eb !important; }
      body[data-theme="light"] .text-ink { color:#ffffff !important; }
      body[data-theme="light"] .bg-gold\/15 { background-color:#dbeafe !important; }
      body[data-theme="light"] .bg-rose-400 { background-color:#fb7185 !important; }
      body[data-theme="light"] .bg-\[\#0f172a\]\/70 { background-color:rgba(15,23,42,.45) !important; }
      body[data-theme="light"] input { color:#172554; }
      body[data-theme="light"] input::placeholder { color:#7185a3; }
      body[data-theme="light"] .icon-button { border-color:#cbdcf1; color:#31527e; background:#f8fbff; }
      body[data-theme="light"] #slip-drawer, body[data-theme="light"] #sheet { background:#fff !important; border-color:#d5e2f3 !important; }
      body[data-theme="light"] .nav-btn.text-gold { color:#2563eb !important; }
      body[data-theme="light"] .nav-btn { color:#526581; }
    </style>
  </head>
  <body class="min-h-screen text-slate-50" data-theme="dark">
    <div id="splash-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-ink text-center">
      <div class="px-6">
        <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-3xl bg-gold text-4xl font-extrabold text-ink shadow-2xl">מ</div>
        <h1 class="text-3xl font-extrabold tracking-tight">מרדכי ווינרים</h1>
        <p class="mt-2 text-sm text-gold">משחק פרטי לחברים ולמשפחה</p>
      </div>
    </div>
    <div id="toasts" class="fixed top-3 z-[80] w-[min(32rem,calc(100%-1.5rem))] left-1/2 -translate-x-1/2"></div>

    <section id="auth-view" class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-5 py-10">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-gold text-3xl font-extrabold text-ink">מ</div>
        <h1 class="text-3xl font-extrabold">מרדכי ווינרים</h1>
        <p class="mt-1 text-gold">חמש ליגות</p>
        <p class="mt-3 text-sm leading-6 text-slate-400">משחק פרטי לחברים ולמשפחה. היתרה וירטואלית ואינה כסף אמיתי.</p>
      </div>
      <div class="rounded-2xl border border-slate-700/50 bg-panel p-5 shadow-2xl">
        <div class="mb-4 grid grid-cols-2 rounded-2xl bg-ink/70 p-1 text-sm">
          <button id="tab-login" type="button" class="rounded-xl bg-gold py-2 font-bold text-ink">התחברות</button>
          <button id="tab-signup" type="button" class="rounded-xl py-2 font-medium text-slate-300">הרשמה</button>
        </div>
        <form id="auth-form" class="space-y-3">
          <label id="username-wrap" class="hidden block text-sm">
            <span class="mb-1 block text-slate-300">שם משתמש</span>
            <input id="username" maxlength="24" class="w-full rounded-2xl border border-white/10 bg-ink px-4 py-3 text-base outline-none focus:border-gold" />
          </label>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">אימייל</span>
            <input id="email" type="email" autocomplete="email" required class="w-full rounded-2xl border border-white/10 bg-ink px-4 py-3 text-base outline-none focus:border-gold" dir="ltr" />
          </label>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">סיסמה</span>
            <input id="password" type="password" minlength="6" autocomplete="current-password" required class="w-full rounded-2xl border border-white/10 bg-ink px-4 py-3 text-base outline-none focus:border-gold" dir="ltr" />
          </label>
          <button id="auth-submit" type="submit" class="w-full rounded-2xl bg-gold py-3 text-base font-extrabold text-ink">כניסה</button>
        </form>
      </div>
    </section>

    <section id="app-view" class="hidden mx-auto min-h-screen max-w-xl pb-28">
      <header class="sticky top-0 z-30 border-b border-slate-700/50 bg-ink/90 px-5 py-4 backdrop-blur">
        <div class="flex items-center justify-between gap-3">
          <button id="logout" type="button" class="icon-button" aria-label="יציאה" title="יציאה"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button>
          <div class="min-w-0 flex-1 text-center">
            <p class="text-xl font-extrabold leading-7 tracking-tight">מרדכי ווינרים</p>
            <div class="mt-1 flex items-center justify-center gap-2 text-xs text-slate-400">
              <span id="hello"></span><span aria-hidden="true">·</span><span>יתרה</span>
              <span class="rounded-full border border-slate-700/50 bg-panel px-2 py-0.5 text-gold" dir="ltr"><span id="balance" class="font-extrabold">0.00</span> ₪</span>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button id="theme-toggle" type="button" class="icon-button" aria-label="החלפת מצב יום ולילה" title="מצב יום / לילה"><svg id="theme-icon" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
            <button id="refresh" type="button" class="icon-button" aria-label="רענון" title="רענון"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg></button>
          </div>
        </div>
      </header>

      <main class="px-4 py-4">
        <div id="games-tools" class="mb-4 space-y-3">
          <div id="league-tabs" class="flex gap-1 overflow-x-auto rounded-2xl border border-slate-700/50 bg-ink/70 p-1 text-xs">
            <button type="button" data-league="all" class="league-tab shrink-0 rounded-xl bg-gold px-3 py-2 font-bold text-ink">הכל</button>
            <button type="button" data-league="israel" class="league-tab shrink-0 rounded-xl px-3 py-2 font-medium text-mist">ליגת העל 🇮🇱</button>
            <button type="button" data-league="ucl" class="league-tab shrink-0 rounded-xl px-3 py-2 font-medium text-mist">צ'מפיונס 🇪🇺</button>
            <button type="button" data-league="spain" class="league-tab shrink-0 rounded-xl px-3 py-2 font-medium text-mist">ספרד 🇪🇸</button>
            <button type="button" data-league="england" class="league-tab shrink-0 rounded-xl px-3 py-2 font-medium text-mist">אנגליה 🏴󠁧󠁢󠁥󠁮󠁧󠁿</button>
            <button type="button" data-league="nations" class="league-tab shrink-0 rounded-xl px-3 py-2 font-medium text-mist">אומות 🌍</button>
          </div>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input id="team-search" type="search" placeholder="חיפוש קבוצה" class="w-full rounded-2xl border border-slate-700/50 bg-panel px-4 py-3 text-sm text-slate-50 outline-none focus:border-gold" />
          </div>
        </div>
        <section id="view-games"></section>
        <section id="view-bets" class="hidden"></section>
        <section id="view-board" class="hidden"></section>
        <section id="view-admin" class="hidden"></section>
      </main>

      <div id="slip" class="fixed inset-x-3 z-40 mx-auto hidden max-w-xl" style="bottom: calc(4.4rem + env(safe-area-inset-bottom))">
        <button id="slip-toggle" type="button" class="flex w-full items-center justify-between rounded-2xl bg-gold px-4 py-3 font-extrabold text-ink shadow-xl">
          <span>🛒 סל הימורים (<span id="slip-count">0</span>)</span>
          <span id="slip-odds" dir="ltr"></span>
        </button>
      </div>

      <div id="slip-backdrop" class="fixed inset-0 z-50 hidden bg-[#0f172a]/70">
        <aside id="slip-drawer" class="absolute inset-x-0 bottom-0 mx-auto max-h-[85vh] w-full max-w-xl overflow-y-auto rounded-t-3xl border border-slate-700/50 bg-panel p-4 shadow-2xl">
          <div class="mb-3 grid grid-cols-2 gap-1 rounded-2xl bg-ink/70 p-1 text-sm">
            <button id="slip-tab-combined" type="button" class="rounded-xl bg-gold py-2 font-bold text-ink">הימור משולב</button>
            <button id="slip-tab-singles" type="button" class="rounded-xl py-2 font-medium text-mist">הימורים נפרדים</button>
          </div>
          <div id="slip-combined">
            <div id="slip-combined-legs"></div>
            <label class="mt-3 block text-sm text-mist">
              סכום ₪
              <input id="slip-stake" inputmode="decimal" value="25" class="mt-1 w-full rounded-2xl border border-slate-700/50 bg-ink px-4 py-3 text-base text-slate-50 outline-none focus:border-gold" dir="ltr" />
            </label>
            <p class="mt-3 text-sm text-mist">יחס <span id="slip-total" class="font-extrabold text-mint" dir="ltr">0.00</span></p>
            <p class="mt-1 text-sm text-mist">תשלום <span id="slip-payout" class="font-extrabold text-gold" dir="ltr">0.00</span> ₪</p>
          </div>
          <div id="slip-singles" class="hidden">
            <div id="slip-single-legs"></div>
            <p class="mt-3 text-sm text-mist">סה״כ <span id="slip-singles-total" class="font-extrabold text-gold" dir="ltr">0.00</span> ₪</p>
          </div>
          <div class="mt-4 grid grid-cols-2 gap-2 pb-[env(safe-area-inset-bottom)]">
            <button id="slip-clear" type="button" class="rounded-2xl border border-slate-700/50 py-3">ניקוי</button>
            <button id="slip-confirm" type="button" class="rounded-2xl bg-gold py-3 font-extrabold text-ink">אישור</button>
          </div>
        </aside>
      </div>

      <nav class="fixed bottom-0 left-1/2 z-40 w-full max-w-xl -translate-x-1/2 border-t border-slate-700/50 bg-ink/95 backdrop-blur">
        <div class="grid grid-cols-4 pb-[env(safe-area-inset-bottom)]">
          <button type="button" data-tab="games" class="nav-btn flex flex-col items-center gap-1 py-3 text-xs text-gold">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18M3 12h18"/></svg>
            משחקים
          </button>
          <button type="button" data-tab="bets" class="nav-btn flex flex-col items-center gap-1 py-3 text-xs text-slate-400">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>
            הימורים
          </button>
          <button type="button" data-tab="board" class="nav-btn flex flex-col items-center gap-1 py-3 text-xs text-slate-400">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V9M12 19V5M19 19v-7"/><path d="M4 19h16"/></svg>
            טבלה
          </button>
          <button id="admin-nav" type="button" data-tab="admin" class="nav-btn hidden flex-col items-center gap-1 py-3 text-xs text-slate-400">
            <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.2 2.1 3-.1.8 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.8 2.9-3-.1L12 21l-2.2-2.1-3 .1-.8-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.8-2.9 3 .1z"/><circle cx="12" cy="12" r="3"/></svg>
            ניהול
          </button>
        </div>
      </nav>
    </section>

    <div id="sheet-backdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#0f172a]/70 p-4">
    <aside id="sheet" class="max-h-[90vh] w-11/12 max-w-[90vw] overflow-y-auto rounded-2xl border border-slate-700/50 bg-panel p-5 shadow-2xl sm:max-w-md">
      <div class="mx-auto mb-4 h-1.5 w-12 rounded-full bg-white/20"></div>
      <p id="sheet-match" class="text-lg font-extrabold"></p>
      <p id="sheet-selection" class="mt-1 text-sm text-slate-300"></p>
      <p id="sheet-note" class="mt-1 hidden text-xs text-mist"></p>
      <div id="sheet-picks" class="mt-3 hidden grid-cols-3 gap-2"></div>
      <div class="mt-4 grid grid-cols-4 gap-2">
        <button type="button" data-stake="10" class="stake rounded-xl bg-white/5 py-2 text-sm">10</button>
        <button type="button" data-stake="25" class="stake rounded-xl bg-white/5 py-2 text-sm">25</button>
        <button type="button" data-stake="50" class="stake rounded-xl bg-white/5 py-2 text-sm">50</button>
        <button type="button" data-stake="100" class="stake rounded-xl bg-white/5 py-2 text-sm">100</button>
      </div>
      <label class="mt-4 block text-sm">
        <span class="mb-1 block text-mist">סכום ₪</span>
        <input id="stake" inputmode="decimal" value="25" class="w-full rounded-2xl border border-white/10 bg-ink px-4 py-3 text-base outline-none focus:border-gold" dir="ltr" />
      </label>
      <p class="mt-3 text-sm text-slate-300">תשלום אפשרי: <span id="sheet-payout" class="font-extrabold text-gold" dir="ltr">0.00</span> ₪</p>
      <p id="sheet-balance" class="mt-1 hidden text-sm text-slate-300"></p>
      <div class="mt-4 grid grid-cols-2 gap-2 pb-[env(safe-area-inset-bottom)]">
        <button id="sheet-cancel" type="button" class="rounded-2xl border border-white/10 py-3">ביטול</button>
        <button id="sheet-confirm" type="button" class="rounded-2xl bg-gold py-3 font-extrabold text-ink">אישור הימור</button>
      </div>
    </aside>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
