name: Hourly football results sync

on:
  schedule:
    # UTC 17:00-22:00 covers Israel 20:00-00:00 in both DST seasons.
    - cron: "0 17-22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-football-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Sync fixtures and results from Smart API via RapidAPI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py
