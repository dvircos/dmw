name: Python regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile sync_sportstats.py team_utils.py
      - name: Validate frontend JavaScript syntax
        run: |
          node --input-type=module --check < js/app.js
          node --input-type=module --check < js/config.js
          node --input-type=module --check < js/format.js
          node --input-type=module --check < js/toast.js
          node --check sw.js
