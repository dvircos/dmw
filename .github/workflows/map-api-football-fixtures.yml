name: Daily API-Football fixture ID mapping

on:
  push:
    branches: [main]
    paths:
      - "sync_api_football.py"
      - ".github/workflows/map-api-football-fixtures.yml"
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-football-fixture-mapping
  cancel-in-progress: false

jobs:
  map-existing-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Link provider IDs to existing games only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python sync_api_football.py fixtures
