name: Python regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, api-football-split-sync]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py sync_api_football.py sync_existing_nations.py
