name: SportStatsAPI fixture import

on:
  push:
    branches: [sportstats-adapter]
    paths:
      - "sync_sportstats.py"
      - ".github/workflows/sportstats-fixtures.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Upcoming fixture window (1-31 days)"
        required: true
        default: "14"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import upcoming fixtures only
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_sportstats.py fixtures --days "${{ inputs.days || '14' }}"
