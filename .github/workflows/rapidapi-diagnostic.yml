name: Temporary RapidAPI diagnostic
on:
  push:
    paths:
      - ".github/workflows/rapidapi-diagnostic.yml"
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Make exactly one provider request and report sanitized diagnostics
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          url = "https://free-api-live-football-data.p.rapidapi.com/football-get-all-matches-by-league"
          r = requests.get(url, params={"leagueid": 5}, headers={
              "x-rapidapi-key": os.environ["API_KEY"],
              "x-rapidapi-host": "free-api-live-football-data.p.rapidapi.com",
          }, timeout=30)
          print("HTTP_STATUS:", r.status_code)
          for name in ("Retry-After", "X-RateLimit-Requests-Limit", "X-RateLimit-Requests-Remaining",
                       "X-RateLimit-Requests-Reset", "X-RapidAPI-Proxy-Response", "X-RapidAPI-Region"):
              if r.headers.get(name) is not None:
                  print(name + ":", r.headers[name])
          body = (r.text or "").replace("\\n", " ").replace("\\r", " ")
          print("BODY:", body[:1200])
          PY
