name: GitHub Actions Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostic.yml"

permissions:
  contents: read

jobs:
  sportstats-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SportStatsAPI read-only
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          base = "https://api.sportstatsapi.com/api/v1"
          headers = {"Authorization": "Bearer " + os.environ["SPORTSTATS_API_KEY"]}
          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read())
                      print("HTTP", response.status, "remaining=", response.headers.get("X-RateLimit-Remaining"), "age=", response.headers.get("Age"))
                      if not data.get("success"):
                          raise RuntimeError("API success=false: " + str(data.get("error")))
                      return data
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR", e.code, e.read().decode("utf-8", "replace")[:1000])
                  raise

          catalogue = get("/soccer/leagues")
          leagues = catalogue.get("data", [])
          print("LEAGUE_COUNT", len(leagues))
          targets = {
              "EPL": lambda x: str(x.get("name", "")).casefold() == "england: premier league",
              "LA_LIGA": lambda x: str(x.get("name", "")).casefold() and "laliga" in str(x.get("name", "")).casefold(),
              "ISRAEL": lambda x: str(x.get("name", "")).casefold() and "ligat ha'al" in str(x.get("name", "")).casefold(),
              "NATIONS_LEAGUE": lambda x: str(x.get("name", "")).casefold() and "nations league" in str(x.get("name", "")).casefold(),
              "CHAMPIONS_LEAGUE": lambda x: str(x.get("name", "")).casefold() and "champions league" in str(x.get("name", "")).casefold(),
          }
          selected = {}
          for key, predicate in targets.items():
              matches = [x for x in leagues if predicate(x)]
              selected[key] = matches
              print("TARGET", key, json.dumps(matches, ensure_ascii=False))
          for key, matches in selected.items():
              if not matches:
                  print("FIXTURES", key, "NO_EXACT_LEAGUE_MATCH")
                  continue
              for league in matches:
                  time.sleep(13)
                  code = league.get("code")
                  print("QUERY", key, "league_code=", code, "name=", league.get("name"))
                  result = get(f"/soccer/matches?league_id={code}&future=true&limit=100")
                  games = result.get("data", [])
                  print("FIXTURES", key, "count=", len(games), "meta=", json.dumps(result.get("meta", {}), ensure_ascii=False)[:500])
                  for game in games[:2]:
                      print("MATCH_SAMPLE", json.dumps(game, ensure_ascii=False)[:2200])
          print("DIAGNOSTIC_COMPLETE")
          PY
